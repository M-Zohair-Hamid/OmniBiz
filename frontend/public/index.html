<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/admin-tools.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Paper Cone Business Management System"
    />
    <title>Administrator-Tools</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Clear session if 'clear' parameter is present (when starting fresh)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('clear') === 'true') {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        localStorage.removeItem('selectedCompanyId');
        localStorage.removeItem('selectedCompanyCode');
        localStorage.removeItem('selectedCompanyName');
        localStorage.removeItem('lastActivity');
        // Remove the parameter from URL
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    </script>
  </body>
</html>

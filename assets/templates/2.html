<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cash Bill</title>
  <style>
    body { font-family: Arial, sans-serif; font-size: 12px; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #000; padding: 6px; text-align: center; }
    .no-border td { border: none; text-align: left; }
  </style>
</head>
<body>

<h1>CASH BILL</h1>

<table class="no-border">
  <tr>
    <td>
      <strong>Seller:</strong><br>
      Business Name<br>
      Address<br>
      Phone | Email
    </td>
    <td>
      <strong>Bill No:</strong> 0000<br>
      <strong>Date:</strong> DD-MM-YYYY
    </td>
  </tr>
</table>

<table>
  <thead>
    <tr>
      <th>Description</th>
      <th>Qty</th>
      <th>Rate</th>
      <th>Amount</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td></td><td></td><td></td><td></td>
    </tr>
  </tbody>
</table>

<p><strong>Total Amount:</strong> ____________________________</p>
<p><strong>Amount in Words:</strong> ____________________________</p>

<p><em>Prices are inclusive of applicable taxes (if any).</em></p>

<p><strong>Signature:</strong> ____________________________</p>

</body>
</html>
